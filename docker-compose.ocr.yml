version: '3.8'

services:
  ocr-service:
    build: ./ocr-service
    ports:
      - "5000:5000"
    volumes:
      - ./ocr-service/models:/app/models
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
