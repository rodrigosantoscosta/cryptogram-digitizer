# EasyOCR Custom Model Training Configuration
# For cryptogram digit recognition (1-27)

experiment_name: 'cryptogram_digits'
train_data: 'all_data'
valid_data: 'all_data/val'
manualSeed: 1111
workers: 4
batch_size: 32
num_iter: 5000
valInterval: 100
saved_model: 'saved_models/english_g2.pth'
FT: True
optim: adam
lr: 0.0001
beta1: 0.9
rho: 0.95
eps: 0.00000001
grad_clip: 5

# Data processing
select_data: 'train'
batch_ratio: '1'
total_data_usage_ratio: 1.0
batch_max_length: 2
imgH: 64
imgW: 200
rgb: False
contrast_adjust: False
sensitive: True
PAD: True
data_filtering_off: False

# Model Architecture (None-VGG-BiLSTM-CTC)
Transformation: 'None'
FeatureExtraction: 'VGG'
SequenceModeling: 'BiLSTM'
Prediction: 'CTC'
num_fiducial: 20
input_channel: 1
output_channel: 256
hidden_size: 256
decode: 'greedy'
new_prediction: False
freeze_FeatureFxtraction: False
freeze_SequenceModeling: False

# Character set (only digits 0-9, since we recognize 1-27 as sequences)
number: '0123456789'
symbol: ''
lang_char: ''
